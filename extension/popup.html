<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input[type="text"] { width: 100%; box-sizing: border-box; padding: 5px; }
  .row { display: flex; align-items: center; gap: 8px; }
  small { color: #666; display: block; margin-top: 4px; }
</style>
<h3 style="margin:0 0 6px">Cash Back Overlay</h3>
<label class="row"><input type="checkbox" id="enabled" /> Show cash back on Best Buy</label>
<label>Confidence threshold: <span id="thVal"></span></label>
<input type="range" id="threshold" min="0" max="1" step="0.05" style="width:100%" />
<small>Below this, the badge says "Check terms".</small>
<label>Classifier backend URL</label>
<input type="text" id="backend" />
<small>Endpoint that forwards to Jev (adds the API key server-side). Default is the local dev server.</small>
<script src="popup.js"></script>
